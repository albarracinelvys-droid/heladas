name: Verificar firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar limites, histeresis y conversion del viento
        run: g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/risk_test.cpp -o /tmp/risk_test && /tmp/risk_test
      - run: pip install platformio==6.2.0
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: .pio/build/*/firmware.hex
